server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Allow file uploads up to 100MB
    client_max_body_size 100M;

    # Proxy all /api/ requests to the backend service
    location /api/ {
        proxy_pass http://backend:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        # ── SSE / streaming support ──────────────────────────────────────
        # Disable Nginx buffering so SSE events reach the browser immediately.
        # Without this, Nginx holds the full response in memory until the
        # stream closes, making it behave exactly like a blocking request.
        proxy_buffering         off;
        proxy_cache             off;
        add_header              X-Accel-Buffering no;

        # Keep the upstream connection alive for long-running streams
        proxy_set_header        Connection '';
        chunked_transfer_encoding on;
        # ────────────────────────────────────────────────────────────────
    }

    # Serve static files; fall back to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
